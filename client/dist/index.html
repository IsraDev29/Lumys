  <title>Lumys* · Conecta · Comprende · Crece</title>

  <!-- El isotipo de marca. `lumys-app-icon.svg` sigue en public/img pero es el
       de la identidad anterior (asterisco naranja sobre verde) y ya no se
       referencia desde ningún sitio. -->
  <link rel="icon" href="/img/lumys-isotipo.svg" type="image/svg+xml">
  <!-- iOS ignora el manifest para el icono y no renderiza SVG acá: necesita PNG. -->
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">

  <!-- PWA: instalable desde el navegador y utilizable sin conexión. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lumys*">

  <!-- Tipografía de marca ----------------------------------------------------
       Fredoka para titulares, botones y navegación: geométrica de terminaciones
       redondeadas, del mismo aire que el isotipo. Es la que hace que la app no
       parezca un trámite — y por eso mismo no se usa en párrafos largos.
       Plus Jakarta Sans para el cuerpo: humanista, altura de x generosa, se lee
       cómoda incluso en un mal momento.

       `display=swap` es deliberado: el texto aparece de inmediato con la fuente
       del sistema y cambia al cargar. En un colegio con conexión intermitente,
       preferimos un salto tipográfico a una pantalla en blanco. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Material Symbols Outlined: la iconografía de las pantallas de Stitch. Se
       pide con los ejes variables (opsz/wght/FILL/GRAD) porque el marcado
       alterna contorno y relleno sobre la misma familia. -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3: solo la hoja de estilos. El bundle de JavaScript ya no se

       utilidad (d-none, d-md-block, gap-2…) se usan en todas las vistas, así
       que el CSS sí se queda. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
