<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="t d">
  <title id="t">Lumys — isotipo</title>
  <desc id="d">Forma orgánica de trazo iridiscente con una sonrisa en color Sol.</desc>

  <!--
    Isotipo de marca. El trazo recorre Lavanda → Sol → Celeste, el mismo
    degradado que la píldora activa de la navegación y el borde de las tarjetas
    destacadas: es el gesto que ata toda la identidad.

    La forma es una curva cerrada de ocho nodos con radios alternos (1.00 en los
    lóbulos, 0.80-0.83 en los valles), generada para que las tangentes queden
    perpendiculares al radio en cada nodo. Por eso no tiene ni un solo vértice
    duro — el contorno entra y sale de cada lóbulo con la misma curvatura, que
    es lo que hace que se lea como algo blando.

    La diferencia entre lóbulo y valle es lo único que separa esta forma de un
    cuadrado redondeado: con valles a 0.90 el ojo la lee como un icono de app
    cualquiera. A 0.80 aparecen los lóbulos y empieza a leerse como una nube.

    El nodo inferior va a 0.94 y no a 1.00 a propósito: una base tan saliente
    como los costados hace que la forma parezca caerse. Recogerla un poco la
    asienta.

    `stroke-linecap="round"` en la sonrisa no es un detalle: un extremo plano
    convierte la curva en un ceño.
  -->

  <defs>
    <linearGradient id="lumys-iris" x1="18%" y1="4%" x2="86%" y2="96%">
      <stop offset="0%"   stop-color="#CDB2FF"/>
      <stop offset="34%"  stop-color="#F0B9D8"/>
      <stop offset="62%"  stop-color="#FFD77A"/>
      <stop offset="100%" stop-color="#AEE0F6"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="210" fill="#FAF8F5"/>

  <g transform="translate(512 496)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path
      stroke="url(#lumys-iris)"
      stroke-width="46"
      d="M0.00,-300.00 C109.26,-300.00 111.95,-240.19 176.07,-176.07 C240.19,-111.95 300.00,-109.26 300.00,0.00 C300.00,109.26 231.51,107.90 169.71,169.71 C107.90,231.51 102.70,282.00 0.00,282.00 C-102.70,282.00 -107.90,231.51 -169.71,169.71 C-231.51,107.90 -300.00,109.26 -300.00,0.00 C-300.00,-109.26 -240.19,-111.95 -176.07,-176.07 C-111.95,-240.19 -109.26,-300.00 0.00,-300.00 Z"/>

    <!-- La sonrisa: un arco simple, ligeramente por debajo del centro óptico. -->
    <path
      stroke="#FFC24D"
      stroke-width="44"
      d="M-118,60 C-72,140 72,140 118,60"/>
  </g>
</svg>
